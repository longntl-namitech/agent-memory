name = "hermes_default"
agent = "hermes"

[hermes]
profile_root = ".hermes-lab/hermes_default"  # this config's own Hermes data root (HERMES_HOME), reused across runs
binary = "hermes"
install_home = ".hermes-home"  # the bootstrapped install, only for `hermes --version`
model = "gpt-5.4-nano"
memory_enabled = true
key_env = "OPENAI_API_KEY"  # the NAME of the variable holding the key; base_url defaults to $OPENAI_BASE_URL
max_turns = 20
